<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexapod 18 Servo Simulator - Kinematika Terbalik & Simulation HUD</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#090d16',
                            card: 'rgba(15, 23, 42, 0.75)',
                            border: 'rgba(239, 68, 68, 0.3)',
                            red: '#ff3b5c',
                            orange: '#ff6b00',
                            cyan: '#00f0ff',
                            accent: '#ef4444'
                        }
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace', 'sans-serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Three.js & OrbitControls Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
        integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"
        integrity="sha384-wagZhIFgY4hD+7awjQjR4e2E294y6J2HSnd8eTNc15ZubTeQeVRZwhQJ+W6hnBsf" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090d16;
            color: #f1f5f9;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
        }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        .glass-panel {
            background: rgba(13, 19, 33, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 107, 0, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
        .glass-panel-cyan {
            background: rgba(13, 19, 33, 0.82);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.25);
        }
        .glow-red { box-shadow: 0 0 15px rgba(255, 59, 92, 0.4); }
        .glow-orange { box-shadow: 0 0 15px rgba(255, 107, 0, 0.4); }
        
        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 107, 0, 0.5); border-radius: 4px; }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 3px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ff6b00;
            cursor: pointer;
            box-shadow: 0 0 8px #ff6b00;
        }

        /* Touch Control Buttons Active State */
        #panelRemote .pad-btn:active, #panelRemote .pad-btn.active {
            background-color: rgba(255, 107, 0, 0.4);
            border-color: #ff6b00;
            transform: scale(0.95);
        }

        #canvas-container canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body class="w-full h-screen relative">

    <!-- 3D CANVAS CONTAINER -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- HEADER TOOLBAR (Top Navigation) -->
    <header class="absolute top-0 left-0 right-0 z-20 p-3 md:p-4 flex items-center justify-between pointer-events-none">
        <div class="flex items-center space-x-3 pointer-events-auto">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-red-600 to-orange-500 flex items-center justify-center shadow-lg glow-orange">
                <i class="fa-solid fa-spider text-white text-lg"></i>
            </div>
            <div>
                <h1 class="text-base md:text-lg font-bold tracking-wider text-white flex items-center gap-2">
                    HEXAPOD 18-SERVO <span class="text-xs px-2 py-0.5 rounded bg-red-950 text-red-400 border border-red-800 font-mono">IK V3.0</span>
                </h1>
                <p class="text-xs text-slate-400 hidden sm:block">Inverse Kinematics Terrain Simulator & Telemetry</p>
            </div>
        </div>

        <!-- Top Right Actions -->
        <div class="flex items-center space-x-2 pointer-events-auto">
            <button id="btnAutoWalk" onclick="toggleAutoWalk()" class="px-4 py-2 rounded-xl text-xs md:text-sm font-semibold bg-red-600 hover:bg-red-500 text-white shadow-lg transition-all flex items-center gap-2 glow-red">
                <i class="fa-solid fa-play" id="autoWalkIcon"></i>
                <span id="autoWalkText">AUTO MAJU</span>
            </button>

            <!-- Desktop Toggle UI Buttons -->
            <button onclick="togglePanel('controls')" class="hidden md:flex p-2.5 rounded-xl glass-panel text-slate-300 hover:text-white transition" title="Toggle Controls">
                <i class="fa-solid fa-sliders"></i>
            </button>
            <button onclick="togglePanel('telemetry')" class="hidden md:flex p-2.5 rounded-xl glass-panel text-slate-300 hover:text-white transition" title="Toggle Telemetry">
                <i class="fa-solid fa-microchip"></i>
            </button>
            <div class="px-3 py-1.5 rounded-xl glass-panel text-xs font-mono text-cyan-400 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="fpsVal">60</span> FPS
            </div>
        </div>
    </header>

    <!-- LEFT PANEL: CONTROLS & TERRAIN OPTIONS -->
    <aside id="panelControls" aria-labelledby="controlsTitle" class="absolute top-16 md:top-20 left-3 md:left-4 z-20 w-80 max-h-[calc(100vh-6rem)] overflow-y-auto glass-panel rounded-2xl p-4 space-y-5 transition-all duration-300">
        <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
            <span id="controlsTitle" class="text-xs font-bold text-orange-400 uppercase tracking-widest flex items-center gap-2">
                <i class="fa-solid fa-gears"></i> Parameter Robot
            </span>
            <span class="text-[10px] font-mono text-slate-400">IK-ENGINE</span>
        </div>

        <!-- Gait Mode Selection -->
        <div class="space-y-2">
            <p class="text-xs font-semibold text-slate-300">Pola Langkah (Gait)</p>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="setGait('tripod')" id="gait-tripod" class="gait-btn py-2 px-3 rounded-lg text-xs font-medium border border-orange-500/50 bg-orange-500/20 text-orange-300 transition">
                    <i class="fa-solid fa-bolt mr-1"></i> Tripod (Cepat)
                </button>
                <button onclick="setGait('wave')" id="gait-wave" class="gait-btn py-2 px-3 rounded-lg text-xs font-medium border border-slate-700 bg-slate-800/50 text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-water mr-1"></i> Wave (Presisi)
                </button>
                <button onclick="setGait('ripple')" id="gait-ripple" class="gait-btn py-2 px-3 rounded-lg text-xs font-medium border border-slate-700 bg-slate-800/50 text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-dharmachakra mr-1"></i> Ripple (Stabil)
                </button>
                <button onclick="setGait('dance')" id="gait-dance" class="gait-btn py-2 px-3 rounded-lg text-xs font-medium border border-slate-700 bg-slate-800/50 text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-music mr-1"></i> Dance Mode
                </button>
            </div>
        </div>

        <!-- Terrain Simulation Selector -->
        <div class="space-y-2">
            <p class="text-xs font-semibold text-slate-300 flex items-center justify-between">
                <span>Rintangan Medan (Terrain)</span>
                <span class="text-[10px] text-cyan-400 font-mono">RAYCAST IK</span>
            </p>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="setTerrain('flat')" id="terrain-flat" class="terrain-btn py-2 px-2.5 rounded-lg text-xs border border-cyan-500/50 bg-cyan-500/20 text-cyan-300 transition text-left">
                    <i class="fa-solid fa-border-all mr-1"></i> Datar
                </button>
                <button onclick="setTerrain('blocks')" id="terrain-blocks" class="terrain-btn py-2 px-2.5 rounded-lg text-xs border border-slate-700 bg-slate-800/50 text-slate-400 hover:text-white transition text-left">
                    <i class="fa-solid fa-cubes mr-1"></i> Balok Step
                </button>
                <button onclick="setTerrain('boulders')" id="terrain-boulders" class="terrain-btn py-2 px-2.5 rounded-lg text-xs border border-slate-700 bg-slate-800/50 text-slate-400 hover:text-white transition text-left">
                    <i class="fa-solid fa-mountain mr-1"></i> Batu Bouldering
                </button>
                <button onclick="setTerrain('ramp')" id="terrain-ramp" class="terrain-btn py-2 px-2.5 rounded-lg text-xs border border-slate-700 bg-slate-800/50 text-slate-400 hover:text-white transition text-left">
                    <i class="fa-solid fa-chart-line mr-1"></i> Tanjakan Ramp
                </button>
            </div>
        </div>

        <!-- Robot Body Pose Sliders -->
        <div class="space-y-3 pt-1 border-t border-slate-700/60">
            <div class="flex items-center justify-between">
                <p class="text-xs font-semibold text-slate-300">Postur Badan (Pose)</p>
                <button onclick="resetPose()" class="text-[10px] text-orange-400 hover:underline">Reset</button>
            </div>

            <div class="space-y-1">
                <div class="flex justify-between text-xs text-slate-400">
                    <label for="sliderBodyY">Tinggi (Height)</label>
                    <span id="valBodyY" class="mono-font text-white">0.0 cm</span>
                </div>
                <input type="range" id="sliderBodyY" min="-1.0" max="1.5" step="0.05" value="0" class="w-full" oninput="updatePose()">
            </div>

            <div class="space-y-1">
                <div class="flex justify-between text-xs text-slate-400">
                    <label for="sliderPitch">Pitch (Kemiringan Depan)</label>
                    <span id="valPitch" class="mono-font text-white">0°</span>
                </div>
                <input type="range" id="sliderPitch" min="-15" max="15" step="1" value="0" class="w-full" oninput="updatePose()">
            </div>

            <div class="space-y-1">
                <div class="flex justify-between text-xs text-slate-400">
                    <label for="sliderRoll">Roll (Kemiringan Samping)</label>
                    <span id="valRoll" class="mono-font text-white">0°</span>
                </div>
                <input type="range" id="sliderRoll" min="-15" max="15" step="1" value="0" class="w-full" oninput="updatePose()">
            </div>
        </div>

        <!-- Walking Parameters -->
        <div class="space-y-3 pt-1 border-t border-slate-700/60">
            <p class="text-xs font-semibold text-slate-300">Dinamika Langkah</p>
            <div class="space-y-1">
                <div class="flex justify-between text-xs text-slate-400">
                    <label for="sliderSpeed">Kecepatan Langkah</label>
                    <span id="valSpeed" class="mono-font text-white">1.0x</span>
                </div>
                <input type="range" id="sliderSpeed" min="0.3" max="2.0" step="0.1" value="1.0" class="w-full">
            </div>

            <div class="space-y-1">
                <div class="flex justify-between text-xs text-slate-400">
                    <label for="sliderStepHeight">Tinggi Angkatan Kaki</label>
                    <span id="valStepHeight" class="mono-font text-white">0.8 cm</span>
                </div>
                <input type="range" id="sliderStepHeight" min="0.4" max="1.8" step="0.1" value="0.8" class="w-full">
            </div>
        </div>
    </aside>

    <!-- RIGHT PANEL: 18 SERVO TELEMETRY GAUGES -->
    <aside id="panelTelemetry" aria-labelledby="telemetryTitle" class="absolute top-16 md:top-20 right-3 md:right-4 z-20 w-80 max-h-[calc(100vh-6rem)] overflow-y-auto glass-panel rounded-2xl p-4 space-y-4 transition-all duration-300">
        <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
            <span id="telemetryTitle" class="text-xs font-bold text-cyan-400 uppercase tracking-widest flex items-center gap-2">
                <i class="fa-solid fa-microchip"></i> Telemetri 18 Servo
            </span>
            <span class="text-[10px] px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800 font-mono">LIVE</span>
        </div>

        <!-- Servo Legs Grid Container -->
        <div id="telemetryGrid" class="space-y-3">
            <!-- Dynamic Telemetry Rows Generated via JS -->
        </div>
    </aside>

    <!-- BOTTOM FLOATING REMOTE D-PAD CONTROLLER -->
    <div id="panelRemote" class="absolute bottom-16 md:bottom-6 left-1/2 -translate-x-1/2 z-20 transition-all duration-300">
        <div class="glass-panel rounded-3xl p-3 md:p-4 flex items-center gap-4 shadow-2xl">
            
            <!-- Left Rotation Buttons -->
            <div class="flex flex-col gap-2">
                <button id="btnTurnLeft" class="pad-btn w-11 h-11 rounded-2xl glass-panel text-slate-200 hover:text-white flex items-center justify-center text-sm transition">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
                <span class="text-[9px] text-center text-slate-400 font-mono">PUTAR L</span>
            </div>

            <!-- Directional D-Pad -->
            <div class="grid grid-cols-3 gap-1.5 w-36 h-36 p-1 rounded-2xl bg-slate-900/60 border border-slate-800">
                <div></div>
                <button id="btnFwd" class="pad-btn rounded-xl bg-slate-800/80 border border-slate-700 text-slate-200 flex items-center justify-center text-lg shadow">
                    <i class="fa-solid fa-caret-up"></i>
                </button>
                <div></div>

                <button id="btnLeft" class="pad-btn rounded-xl bg-slate-800/80 border border-slate-700 text-slate-200 flex items-center justify-center text-lg shadow">
                    <i class="fa-solid fa-caret-left"></i>
                </button>
                <div class="flex items-center justify-center">
                    <div class="w-3 h-3 rounded-full bg-orange-500/60 animate-ping"></div>
                </div>
                <button id="btnRight" class="pad-btn rounded-xl bg-slate-800/80 border border-slate-700 text-slate-200 flex items-center justify-center text-lg shadow">
                    <i class="fa-solid fa-caret-right"></i>
                </button>

                <div></div>
                <button id="btnBwd" class="pad-btn rounded-xl bg-slate-800/80 border border-slate-700 text-slate-200 flex items-center justify-center text-lg shadow">
                    <i class="fa-solid fa-caret-down"></i>
                </button>
                <div></div>
            </div>

            <!-- Right Rotation Buttons -->
            <div class="flex flex-col gap-2">
                <button id="btnTurnRight" class="pad-btn w-11 h-11 rounded-2xl glass-panel text-slate-200 hover:text-white flex items-center justify-center text-sm transition">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
                <span class="text-[9px] text-center text-slate-400 font-mono">PUTAR R</span>
            </div>
        </div>
    </div>

    <!-- MOBILE NAVIGATION BOTTOM DOCK -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 z-30 bg-slate-950/90 border-t border-slate-800 backdrop-blur-md px-4 py-2 flex items-center justify-around">
        <button onclick="selectMobileTab('3d')" id="tab-3d" class="flex flex-col items-center text-orange-400 text-xs">
            <i class="fa-solid fa-cube text-base"></i>
            <span class="text-[10px] mt-0.5">3D View</span>
        </button>
        <button onclick="selectMobileTab('controls')" id="tab-controls" class="flex flex-col items-center text-slate-400 text-xs">
            <i class="fa-solid fa-sliders text-base"></i>
            <span class="text-[10px] mt-0.5">Kontrol</span>
        </button>
        <button onclick="selectMobileTab('remote')" id="tab-remote" class="flex flex-col items-center text-slate-400 text-xs">
            <i class="fa-solid fa-gamepad text-base"></i>
            <span class="text-[10px] mt-0.5">Remote</span>
        </button>
        <button onclick="selectMobileTab('telemetry')" id="tab-telemetry" class="flex flex-col items-center text-slate-400 text-xs">
            <i class="fa-solid fa-microchip text-base"></i>
            <span class="text-[10px] mt-0.5">Telemetri</span>
        </button>
    </nav>

    <!-- SIMULATION LOGIC SCRIPT -->
    <script>
        // Global Constants & State
        const NUM_LEGS = 6;
        
        // Corrected Leg Angles (Front is -Z, Right is +X)
        const LEG_ANGLES = [
            -Math.PI / 4,    // Leg 1: Depan Kanan (-45 deg, X>0, Z<0)
            0,               // Leg 2: Tengah Kanan (0 deg, X>0, Z=0)
            Math.PI / 4,     // Leg 3: Belakang Kanan (45 deg, X>0, Z>0)
            3 * Math.PI / 4, // Leg 4: Belakang Kiri (135 deg, X<0, Z>0)
            Math.PI,         // Leg 5: Tengah Kiri (180 deg, X<0, Z=0)
            -3 * Math.PI / 4 // Leg 6: Depan Kiri (-135 deg, X<0, Z<0)
        ];

        const LEG_NAMES = ["Depan Kanan", "Tengah Kanan", "Belakang Kanan", "Belakang Kiri", "Tengah Kiri", "Depan Kiri"];

        // Leg Segment Lengths (in world units)
        const L_COXA = 0.85;   // Hip rotater (Servo 1)
        const L_FEMUR = 1.6;   // Thigh (Servo 2)
        const L_TIBIA = 2.4;   // Shin / Curved Blade (Servo 3)

        const DEFAULT_BODY_HEIGHT = 2.0; // Elevated standing height (Fix for ceper body)
        const NEUTRAL_FOOT_R = 3.6;
        const NEUTRAL_FOOT_Y = -DEFAULT_BODY_HEIGHT;

        // Gait Patterns (Swing groups)
        const GAIT_PATTERNS = {
            tripod: {
                groups: [[0, 3, 4], [1, 2, 5]], // 2 phases
                dutyFactor: 0.5
            },
            wave: {
                groups: [[0], [1], [2], [3], [4], [5]], // 6 phases
                dutyFactor: 0.83
            },
            ripple: {
                groups: [[0, 3], [1, 4], [2, 5]], // 3 phases
                dutyFactor: 0.66
            },
            dance: {
                groups: [[0, 2, 4], [1, 3, 5]],
                dutyFactor: 0.5
            }
        };

        // Global Simulation Variables
        let currentGait = 'tripod';
        let currentTerrain = 'flat';
        let autoWalk = false;
        let controlState = { forward: 0, strafe: 0, turn: 0 };

        // Pose settings
        let poseY = 0, posePitch = 0, poseRoll = 0;
        let stepSpeed = 1.0, stepHeight = 0.8;

        // Three.js Scene Variables
        let scene, camera, renderer, controls;
        let hexapodGroup, robotBodyGroup;
        let legs = [];
        let terrainObjects = [];

        // Animation Loop Variables
        let clock = new THREE.Clock();
        let stepPhase = 0;
        let hexapodHeading = 0; // Yaw angle in radians
        let currentVelocity = new THREE.Vector3(0, 0, 0);
        let currentTurnVel = 0; // Smooth angular velocity for turning

        // --- 1. TELEMETRY UI INITIALIZATION ---
        function initTelemetryUI() {
            const container = document.getElementById('telemetryGrid');
            container.innerHTML = '';
            for (let i = 0; i < NUM_LEGS; i++) {
                const legCard = document.createElement('div');
                legCard.className = 'p-2.5 rounded-xl bg-slate-900/70 border border-slate-800 space-y-1.5';
                legCard.innerHTML = `
                    <div class="flex items-center justify-between text-xs">
                        <span class="font-semibold text-slate-300">Leg ${i+1} (${LEG_NAMES[i]})</span>
                        <span id="legState-${i}" class="text-[9px] px-1.5 py-0.2 rounded bg-emerald-950 text-emerald-400 font-mono">STANCE</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-[10px] font-mono">
                        <div class="bg-slate-950/80 p-1 rounded text-center border border-slate-800">
                            <span class="text-slate-500 block text-[8px]">COXA</span>
                            <span id="ang-coxa-${i}" class="text-amber-400 font-bold">0°</span>
                        </div>
                        <div class="bg-slate-950/80 p-1 rounded text-center border border-slate-800">
                            <span class="text-slate-500 block text-[8px]">FEMUR</span>
                            <span id="ang-femur-${i}" class="text-orange-400 font-bold">0°</span>
                        </div>
                        <div class="bg-slate-950/80 p-1 rounded text-center border border-slate-800">
                            <span class="text-slate-500 block text-[8px]">TIBIA</span>
                            <span id="ang-tibia-${i}" class="text-cyan-400 font-bold">0°</span>
                        </div>
                    </div>
                `;
                container.appendChild(legCard);
            }
        }

        // --- 2. THREE.JS SCENE CREATION ---
        function initScene() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x090d16);
            scene.fog = new THREE.FogExp2(0x090d16, 0.035);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(5, 5, 7);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.02;
            controls.minDistance = 3;
            controls.maxDistance = 25;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
            dirLight.position.set(10, 20, -10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 40;
            const d = 12;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            const cyanLight = new THREE.PointLight(0x00f0ff, 1.5, 15);
            cyanLight.position.set(0, 2, 0);
            scene.add(cyanLight);

            // Ground Grid & Base Floor
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x0c1322, roughness: 0.8, metalness: 0.2 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const grid = new THREE.GridHelper(100, 100, 0xff3b5c, 0x1e293b);
            grid.position.y = 0.01;
            scene.add(grid);

            buildRobot();
            buildTerrain('flat');

            window.addEventListener('resize', onWindowResize);
        }

        // --- 3. ROBOT MODEL BUILDER (Matching 3D Printed Photo Frame) ---
        function buildRobot() {
            hexapodGroup = new THREE.Group();
            hexapodGroup.position.y = DEFAULT_BODY_HEIGHT;
            scene.add(hexapodGroup);

            robotBodyGroup = new THREE.Group();
            hexapodGroup.add(robotBodyGroup);

            // Materials
            const orangeRedMat = new THREE.MeshStandardMaterial({ color: 0xff3b00, roughness: 0.3, metalness: 0.1 }); // 3D printed body
            const blackFrameMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5, metalness: 0.2 });
            const servoBodyMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.3, metalness: 0.5 });
            const servoLabelMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.4 });
            const servoHornMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.9, roughness: 0.2 });
            const batteryMat = new THREE.MeshStandardMaterial({ color: 0x0055ff, roughness: 0.3 });
            const strapMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.6 });

            // Dual Deck Chassis (Orange/Red Hexagonal Shape)
            const bodyShape = new THREE.Shape();
            const r = 1.7;
            for (let i = 0; i < 6; i++) {
                const a = i * Math.PI / 3 + Math.PI / 6;
                const x = r * Math.cos(a);
                const y = r * Math.sin(a);
                if (i === 0) bodyShape.moveTo(x, y);
                else bodyShape.lineTo(x, y);
            }
            bodyShape.closePath();

            // Inner Ventilation Cutouts
            const hole1 = new THREE.Path(); hole1.absellipse(0, 0.4, 0.4, 0.25, 0, Math.PI*2, false, 0); bodyShape.holes.push(hole1);
            const hole2 = new THREE.Path(); hole2.absellipse(0, -0.4, 0.4, 0.25, 0, Math.PI*2, false, 0); bodyShape.holes.push(hole2);

            const extrudeSettings = { depth: 0.08, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.03, bevelThickness: 0.03 };
            const botPlateGeo = new THREE.ExtrudeGeometry(bodyShape, extrudeSettings);
            botPlateGeo.rotateX(Math.PI / 2);

            const botPlate = new THREE.Mesh(botPlateGeo, orangeRedMat);
            botPlate.position.y = -0.25;
            botPlate.castShadow = true;
            robotBodyGroup.add(botPlate);

            const topPlate = botPlate.clone();
            topPlate.position.y = 0.25;
            robotBodyGroup.add(topPlate);

            // Standoff Pillars
            for (let i = 0; i < 6; i++) {
                const a = i * Math.PI / 3;
                const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.5, 8), blackFrameMat);
                pillar.position.set(Math.cos(a) * 1.25, 0, Math.sin(a) * 1.25);
                robotBodyGroup.add(pillar);
            }

            // Central Black Controller Box
            const ctrlBox = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.4, 1.0), blackFrameMat);
            ctrlBox.position.set(0, -0.01, 0);
            robotBodyGroup.add(ctrlBox);

            // Front LEDs (Facing -Z Forward)
            const ledRed = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
            ledRed.position.set(-0.2, 0, -0.52);
            robotBodyGroup.add(ledRed);
            const ledGreen = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
            ledGreen.position.set(0.2, 0, -0.52);
            robotBodyGroup.add(ledGreen);

            // Blue LiPo Battery Pack on Top Plate with Yellow Strap
            const battery = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.32, 0.6), batteryMat);
            battery.position.set(0, 0.44, 0);
            battery.castShadow = true;
            robotBodyGroup.add(battery);

            const strap = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.35, 0.64), strapMat);
            strap.position.set(0, 0.45, 0);
            robotBodyGroup.add(strap);

            // Detailed 3-Servo Model Creator Helper
            function createServoMesh(jointLabel) {
                const g = new THREE.Group();
                const b = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.44, 0.36), servoBodyMat);
                b.castShadow = true; g.add(b);

                // Servo Gold Label Accent
                const lbl = new THREE.Mesh(new THREE.BoxGeometry(0.37, 0.18, 0.37), servoLabelMat);
                g.add(lbl);

                // Servo Horn Output Shaft
                const h = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.08, 12), servoHornMat);
                h.position.set(0.08, 0.24, 0); g.add(h);

                // Metallic Pivot Pin
                const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.48, 8), servoHornMat);
                pin.rotation.z = Math.PI / 2; g.add(pin);

                return g;
            }

            // Build 6 Legs with 3 Servos Each (3 Articulated Joints)
            legs = [];
            const hipRadius = 1.65;
            for (let i = 0; i < NUM_LEGS; i++) {
                const angle = LEG_ANGLES[i];
                const hipX = Math.cos(angle) * hipRadius;
                const hipZ = Math.sin(angle) * hipRadius;

                // Root Hip Mount
                const hipGroup = new THREE.Group();
                hipGroup.position.set(hipX, 0, hipZ);
                hipGroup.rotation.y = -angle;
                robotBodyGroup.add(hipGroup);

                // --- SERVO 1: COXA JOINT (Panggul / Rotasi Yaw) ---
                const coxaGroup = new THREE.Group();
                hipGroup.add(coxaGroup);
                const coxaServo = createServoMesh('COXA');
                coxaGroup.add(coxaServo);

                const coxaBracket = new THREE.Mesh(new THREE.BoxGeometry(L_COXA, 0.22, 0.36), blackFrameMat);
                coxaBracket.position.set(L_COXA / 2, 0, 0);
                coxaBracket.castShadow = true;
                coxaGroup.add(coxaBracket);

                // --- SERVO 2: FEMUR JOINT (Paha / Elevasi Pitch) ---
                const femurGroup = new THREE.Group();
                femurGroup.position.set(L_COXA, 0, 0);
                coxaGroup.add(femurGroup);

                const femurServo = createServoMesh('FEMUR');
                femurServo.rotation.x = Math.PI / 2;
                femurGroup.add(femurServo);

                // Double Truss Black Femur Arm
                const femurPlateTop = new THREE.Mesh(new THREE.BoxGeometry(L_FEMUR, 0.08, 0.28), blackFrameMat);
                femurPlateTop.position.set(L_FEMUR / 2, 0.14, 0);
                femurPlateTop.castShadow = true;
                femurGroup.add(femurPlateTop);

                const femurPlateBot = femurPlateTop.clone();
                femurPlateBot.position.y = -0.14;
                femurGroup.add(femurPlateBot);

                // --- SERVO 3: TIBIA JOINT (Betis / Tekuk Knee Pitch) ---
                const tibiaGroup = new THREE.Group();
                tibiaGroup.position.set(L_FEMUR, 0, 0);
                femurGroup.add(tibiaGroup);

                const tibiaServo = createServoMesh('TIBIA');
                tibiaServo.rotation.x = Math.PI / 2;
                tibiaGroup.add(tibiaServo);

                // Curved Blade Tibia (Origin (0,0) is knee joint, Tip is at (L_TIBIA, 0))
                const tibiaShape = new THREE.Shape();
                tibiaShape.moveTo(0, 0.12);
                tibiaShape.quadraticCurveTo(L_TIBIA * 0.4, 0.35, L_TIBIA * 0.75, 0.2);
                tibiaShape.lineTo(L_TIBIA, 0); // Exact foot tip anchor
                tibiaShape.quadraticCurveTo(L_TIBIA * 0.5, -0.15, 0, -0.12);
                tibiaShape.closePath();

                const tibiaExtrude = { depth: 0.08, bevelEnabled: true, bevelSize: 0.015, bevelThickness: 0.015, steps: 1 };
                const tibiaGeo = new THREE.ExtrudeGeometry(tibiaShape, tibiaExtrude);
                tibiaGeo.translate(0, 0, -0.04); // Center extrusion thickness around Z=0

                const tibiaMesh = new THREE.Mesh(tibiaGeo, orangeRedMat);
                tibiaMesh.castShadow = true;
                tibiaGroup.add(tibiaMesh);

                // Tip Anchor Marker
                const footTip = new THREE.Group();
                footTip.position.set(L_TIBIA, 0, 0); // Exact tip location matching IK math
                tibiaGroup.add(footTip);

                // Calculate Home Position in Local & World Coordinates
                const homeR = NEUTRAL_FOOT_R;
                const homeX_local = homeR;
                const homeZ_local = 0;
                const homeY_local = NEUTRAL_FOOT_Y;
                const homePosLocal = new THREE.Vector3(homeX_local, homeY_local, homeZ_local);

                legs.push({
                    id: i,
                    hipGroup, coxaGroup, femurGroup, tibiaGroup, footTip,
                    homePosLocal,
                    currentFootPosWorld: new THREE.Vector3(),
                    targetFootPosWorld: new THREE.Vector3(),
                    liftOffPosWorld: new THREE.Vector3(),
                    angles: { coxa: 0, femur: 0, tibia: 0 },
                    isStance: true
                });
            }

            // Init foot positions in world space
            robotBodyGroup.updateMatrixWorld(true);
            legs.forEach(leg => {
                const worldPos = leg.homePosLocal.clone();
                leg.hipGroup.localToWorld(worldPos);
                leg.currentFootPosWorld.copy(worldPos);
                leg.targetFootPosWorld.copy(worldPos);
            });
        }

        // --- 4. TERRAIN BUILDER (Flat, Step Blocks, Boulders, Ramp) ---
        function buildTerrain(type) {
            // Remove existing terrain
            terrainObjects.forEach(obj => scene.remove(obj));
            terrainObjects = [];
            currentTerrain = type;

            if (type === 'blocks') {
                for (let i = 0; i < 16; i++) {
                    const w = 1.2 + Math.random() * 0.8;
                    const h = 0.2 + Math.random() * 0.4;
                    const d = 1.2 + Math.random() * 0.8;
                    const block = new THREE.Mesh(
                        new THREE.BoxGeometry(w, h, d),
                        new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 })
                    );
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 2 + Math.random() * 6;
                    block.position.set(Math.cos(angle) * dist, h / 2, Math.sin(angle) * dist);
                    block.receiveShadow = true; block.castShadow = true;
                    scene.add(block);
                    terrainObjects.push(block);
                }
            } else if (type === 'boulders') {
                for (let i = 0; i < 14; i++) {
                    const r = 0.4 + Math.random() * 0.5;
                    const boulder = new THREE.Mesh(
                        new THREE.DodecahedronGeometry(r, 1),
                        new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 })
                    );
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 2.5 + Math.random() * 6;
                    boulder.position.set(Math.cos(angle) * dist, r * 0.5, Math.sin(angle) * dist);
                    boulder.rotation.set(Math.random(), Math.random(), Math.random());
                    boulder.receiveShadow = true; boulder.castShadow = true;
                    scene.add(boulder);
                    terrainObjects.push(boulder);
                }
            } else if (type === 'ramp') {
                const ramp = new THREE.Mesh(
                    new THREE.BoxGeometry(4, 0.1, 10),
                    new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7 })
                );
                ramp.position.set(0, 0.8, 4);
                ramp.rotation.x = -0.15;
                ramp.receiveShadow = true; ramp.castShadow = true;
                scene.add(ramp);
                terrainObjects.push(ramp);
            }
        }

        // Terrain Height Raycaster Function
        function getTerrainHeightAt(x, z) {
            if (currentTerrain === 'flat' || terrainObjects.length === 0) return 0;
            const raycaster = new THREE.Raycaster(new THREE.Vector3(x, 10, z), new THREE.Vector3(0, -1, 0));
            const intersects = raycaster.intersectObjects(terrainObjects);
            if (intersects.length > 0) {
                return intersects[0].point.y;
            }
            return 0;
        }

        // --- 5. INVERSE KINEMATICS (3-DOF Trigonometric Solver) ---
        function solveIK(leg, targetLocalPos) {
            // targetLocalPos relative to Coxa Pivot
            const x = targetLocalPos.x;
            const y = targetLocalPos.y;
            const z = targetLocalPos.z;

            // 1. Coxa Angle (Yaw in horizontal plane)
            const coxaAngle = Math.atan2(z, x);

            // Projection onto leg plane
            const r = Math.hypot(x, z) - L_COXA;
            const d = Math.hypot(r, y);

            // Reach boundary check
            const maxReach = (L_FEMUR + L_TIBIA) * 0.98;
            const minReach = Math.abs(L_FEMUR - L_TIBIA) + 0.1;
            const clampedD = Math.max(minReach, Math.min(maxReach, d));

            // 2. Femur Angle
            const alpha = Math.atan2(y, r);
            const beta = Math.acos((L_FEMUR * L_FEMUR + clampedD * clampedD - L_TIBIA * L_TIBIA) / (2 * L_FEMUR * clampedD));
            const femurAngle = alpha + beta;

            // 3. Tibia Angle
            const gamma = Math.acos((L_FEMUR * L_FEMUR + L_TIBIA * L_TIBIA - clampedD * clampedD) / (2 * L_FEMUR * L_TIBIA));
            const tibiaAngle = gamma - Math.PI;

            // Apply joint rotations
            leg.coxaGroup.rotation.y = coxaAngle;
            leg.femurGroup.rotation.z = femurAngle;
            leg.tibiaGroup.rotation.z = tibiaAngle;

            // Store degrees for telemetry
            leg.angles.coxa = Math.round(THREE.MathUtils.radToDeg(coxaAngle));
            leg.angles.femur = Math.round(THREE.MathUtils.radToDeg(femurAngle));
            leg.angles.tibia = Math.round(THREE.MathUtils.radToDeg(tibiaAngle));
        }

        // --- 6. GAIT GENERATOR & ANIMATION LOOP ---
        function updateGaitAndIK(deltaTime) {
            // Velocity calculation from inputs
            let inputFwd = controlState.forward;
            let inputStrafe = controlState.strafe;
            let inputTurn = controlState.turn;

            if (autoWalk) inputFwd = 1.0;

            const targetVel = new THREE.Vector3(inputStrafe, 0, -inputFwd).multiplyScalar(1.5 * stepSpeed);
            currentVelocity.lerp(targetVel, 0.1);

            // Smooth angular velocity (inertia on turn start/stop)
            const targetTurnVel = inputTurn * 1.2 * stepSpeed;
            currentTurnVel = THREE.MathUtils.lerp(currentTurnVel, targetTurnVel, 0.1);

            const isMoving = currentVelocity.lengthSq() > 0.001 || Math.abs(currentTurnVel) > 0.005;

            // Advance gait phase clock
            if (isMoving) {
                stepPhase += deltaTime * 2.5 * stepSpeed;
            }

            // Update Robot Body World Position & Orientation
            if (isMoving) {
                hexapodHeading += currentTurnVel * deltaTime;
                hexapodGroup.rotation.y = hexapodHeading;

                const moveDelta = currentVelocity.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), hexapodHeading).multiplyScalar(deltaTime);
                hexapodGroup.position.add(moveDelta);
            }

            // Body Pose & Dynamic Sway (Roll, Pitch, Heave for smooth weight transfer)
            const radPitch = THREE.MathUtils.degToRad(posePitch);
            const radRoll = THREE.MathUtils.degToRad(poseRoll);

            let swayY = 0;
            let swayRoll = 0;
            let swayPitch = 0;

            if (isMoving) {
                const swayFreq = stepPhase * Math.PI * 2;
                swayY = Math.sin(swayFreq) * 0.08 * stepHeight;
                // Add natural banking roll into turn direction
                swayRoll = Math.sin(swayFreq * 0.5) * 0.04 - currentTurnVel * 0.05;
                swayPitch = Math.cos(swayFreq * 0.5) * 0.03;
            }

            hexapodGroup.position.y = DEFAULT_BODY_HEIGHT;
            robotBodyGroup.position.y = poseY + swayY;
            robotBodyGroup.rotation.x = radPitch + swayPitch;
            robotBodyGroup.rotation.z = radRoll + swayRoll;

            robotBodyGroup.updateMatrixWorld(true);

            // Gait Pattern Configuration
            const pattern = GAIT_PATTERNS[currentGait] || GAIT_PATTERNS.tripod;
            const numGroups = pattern.groups.length;
            const cyclePhase = (stepPhase % numGroups);
            const activeGroupIdx = Math.floor(cyclePhase);
            const groupProgress = cyclePhase - activeGroupIdx; // 0 to 1

            // Leg IK Updates
            legs.forEach((leg, i) => {
                // Determine if this leg is in SWING (in air) or STANCE (on ground)
                const inSwingGroup = pattern.groups[activeGroupIdx].includes(i);

                // Compute neutral step home position in World Space
                const idealWorldFoot = leg.homePosLocal.clone();
                leg.hipGroup.localToWorld(idealWorldFoot);

                // Adjust ideal foot Y with terrain height underneath
                const groundY = getTerrainHeightAt(idealWorldFoot.x, idealWorldFoot.z);
                idealWorldFoot.y = groundY;

                if (inSwingGroup && isMoving) {
                    if (leg.isStance) {
                        // Just started swinging: lock liftoff pos
                        leg.isStance = false;
                        leg.liftOffPosWorld.copy(leg.currentFootPosWorld);
                    }

                    // Predict stride landing target ahead of body motion (Linear + Rotational tangent stride)
                    const strideVector = currentVelocity.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), hexapodHeading).multiplyScalar(0.35);
                    
                    // Exact tangential rotational offset per foot
                    const relX = idealWorldFoot.x - hexapodGroup.position.x;
                    const relZ = idealWorldFoot.z - hexapodGroup.position.z;
                    const rotStride = new THREE.Vector3(-relZ, 0, relX).multiplyScalar(currentTurnVel * 0.25);

                    leg.targetFootPosWorld.copy(idealWorldFoot).add(strideVector).add(rotStride);
                    leg.targetFootPosWorld.y = getTerrainHeightAt(leg.targetFootPosWorld.x, leg.targetFootPosWorld.z);

                    // Interpolate Swing arc (Quintic Smoothstep for ultra-smooth trajectory)
                    const t = groupProgress;
                    const smoothT = t * t * t * (t * (t * 6 - 15) + 10);
                    
                    const swingTarget = new THREE.Vector3();
                    swingTarget.lerpVectors(leg.liftOffPosWorld, leg.targetFootPosWorld, smoothT);

                    // Add Vertical Step Arc using smooth sine wave
                    const arcHeight = stepHeight * Math.sin(t * Math.PI);
                    swingTarget.y += arcHeight;

                    // Exponential smoothing towards swing target for zero-jitter
                    leg.currentFootPosWorld.lerp(swingTarget, 0.35);

                } else {
                    // STANCE PHASE: Foot stays planted on ground while body moves
                    leg.isStance = true;

                    if (!isMoving) {
                        // Smoothly return foot to neutral position when stopped
                        leg.currentFootPosWorld.lerp(idealWorldFoot, 0.15);
                    } else {
                        // Maintain ground contact height
                        leg.currentFootPosWorld.y = getTerrainHeightAt(leg.currentFootPosWorld.x, leg.currentFootPosWorld.z);
                    }
                }

                // Convert World Foot position back into Hip Local coordinates for IK Solver
                const localTarget = leg.currentFootPosWorld.clone();
                leg.hipGroup.worldToLocal(localTarget);

                // Solve 18-Servo Angles
                solveIK(leg, localTarget);
            });

            // Update Telemetry Panel
            updateTelemetryUI();
        }

        // --- 7. TELEMETRY DOM UPDATER ---
        function updateTelemetryUI() {
            legs.forEach((leg, i) => {
                const elState = document.getElementById(`legState-${i}`);
                const elCoxa = document.getElementById(`ang-coxa-${i}`);
                const elFemur = document.getElementById(`ang-femur-${i}`);
                const elTibia = document.getElementById(`ang-tibia-${i}`);

                if (elState) {
                    elState.innerText = leg.isStance ? "STANCE" : "SWING";
                    elState.className = leg.isStance ?
                        "text-[9px] px-1.5 py-0.2 rounded bg-emerald-950 text-emerald-400 font-mono" :
                        "text-[9px] px-1.5 py-0.2 rounded bg-orange-950 text-orange-400 font-mono animate-pulse";
                }
                if (elCoxa) elCoxa.innerText = `${leg.angles.coxa}°`;
                if (elFemur) elFemur.innerText = `${leg.angles.femur}°`;
                if (elTibia) elTibia.innerText = `${leg.angles.tibia}°`;
            });
        }

        // --- 8. UI CONTROLS & EVENT HANDLERS ---
        function setGait(mode) {
            currentGait = mode;
            document.querySelectorAll('.gait-btn').forEach(btn => {
                btn.className = "gait-btn py-2 px-3 rounded-lg text-xs font-medium border border-slate-700 bg-slate-800/50 text-slate-400 hover:text-white transition";
            });
            const active = document.getElementById(`gait-${mode}`);
            if (active) active.className = "gait-btn py-2 px-3 rounded-lg text-xs font-medium border border-orange-500/50 bg-orange-500/20 text-orange-300 transition";
        }

        function setTerrain(type) {
            buildTerrain(type);
            document.querySelectorAll('.terrain-btn').forEach(btn => {
                btn.className = "terrain-btn py-2 px-2.5 rounded-lg text-xs border border-slate-700 bg-slate-800/50 text-slate-400 hover:text-white transition text-left";
            });
            const active = document.getElementById(`terrain-${type}`);
            if (active) active.className = "terrain-btn py-2 px-2.5 rounded-lg text-xs border border-cyan-500/50 bg-cyan-500/20 text-cyan-300 transition text-left";

            autoWalk = !autoWalk;

        function updatePose() {

            posePitch = Number.parseFloat(document.getElementById('sliderPitch').value);
            poseRoll = Number.parseFloat(document.getElementById('sliderRoll').value);

        function togglePanel(name) {
            const p = name === 'controls' ? document.getElementById('panelControls') : document.getElementById('panelTelemetry');

            pCtrl.classList.add('hidden');

        }

        // --- 9. KEYBOARD & TOUCH GAMEPAD INPUT LISTENERS ---
        function setupInputs() {
            window.addEventListener('keydown', (e) => {
                if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') controlState.forward = 1;
                if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') controlState.forward = -1;
                if (e.key === 'a' || e.key === 'A') controlState.strafe = -1;
                if (e.key === 'd' || e.key === 'D') controlState.strafe = 1;
                if (e.key === 'q' || e.key === 'Q' || e.key === 'ArrowLeft') controlState.turn = 1;
                if (e.key === 'e' || e.key === 'E' || e.key === 'ArrowRight') controlState.turn = -1;
            });

            window.addEventListener('keyup', (e) => {
                if (['w','W','ArrowUp','s','S','ArrowDown'].includes(e.key)) controlState.forward = 0;
                if (['a','A','d','D'].includes(e.key)) controlState.strafe = 0;
                if (['q','Q','ArrowLeft','e','E','ArrowRight'].includes(e.key)) controlState.turn = 0;
            });

            // Virtual D-Pad Touch/Mouse Bindings
            const bindBtn = (id, actionKey, val) => {
                const btn = document.getElementById(id);
                if (!btn) return;
                const start = (e) => { e.preventDefault(); controlState[actionKey] = val; btn.classList.add('active'); };
                const end = (e) => { e.preventDefault(); controlState[actionKey] = 0; btn.classList.remove('active'); };

                btn.addEventListener('mousedown', start);
                btn.addEventListener('mouseup', end);
                btn.addEventListener('mouseleave', end);
                btn.addEventListener('touchstart', start);
                btn.addEventListener('touchend', end);
            };

            bindBtn('btnFwd', 'forward', 1);
            bindBtn('btnBwd', 'forward', -1);
            bindBtn('btnLeft', 'strafe', -1);
            bindBtn('btnRight', 'strafe', 1);
            bindBtn('btnTurnLeft', 'turn', 1);
            bindBtn('btnTurnRight', 'turn', -1);

            // Speed & Step sliders
            document.getElementById('sliderSpeed').addEventListener('input', (e) => {
                stepSpeed = Number.parseFloat(e.target.value);
                document.getElementById('valSpeed').innerText = `${stepSpeed.toFixed(1)}x`;
            });
            document.getElementById('sliderStepHeight').addEventListener('input', (e) => {
                stepHeight = Number.parseFloat(e.target.value);
                document.getElementById('valStepHeight').innerText = `${stepHeight.toFixed(1)} cm`;
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 10. MAIN ANIMATION LOOP ---
        let lastTime = performance.now();
        let frameCount = 0;
        let fpsTimer = 0;

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const deltaTime = Math.min((now - lastTime) / 1000, 0.05); // Cap delta to avoid jumps
            lastTime = now;

            // FPS Counter
            frameCount++;
            fpsTimer += deltaTime;
            if (fpsTimer >= 1.0) {
                document.getElementById('fpsVal').innerText = frameCount;
                frameCount = 0;
                fpsTimer = 0;
            }

            // Update Robot Kinematics & Gait Animation
            updateGaitAndIK(deltaTime);

            // Smooth Camera Follow
            controls.target.lerp(hexapodGroup.position, 0.05);
            controls.update();

            renderer.render(scene, camera);
        }

        // --- INITIALIZATION ON LOAD ---
        window.onload = function() {
            initTelemetryUI();
            initScene();
            setupInputs();
            animate();
        };
    </script>
</body>
</html>
